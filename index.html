<!DOCTYPE html>
<html>
<head>
    <title>ANF Cinema</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* VIDEO FULL SCREEN */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* OVERLAY TEXT */
        .overlay {
    position: absolute;
    top: 30px;
    right: 40px;
    text-align: right;
    background: rgba(0,0,0,0.4);
    padding: 15px 25px;
    border-radius: 10px;
}

/* JUDUL BESAR + KEDIP */
h1 {
    font-size: 25px;
    margin-bottom: 5px;
    animation: blink 1s infinite;
}

/* SUBTITLE */
p {
    font-size: 15px;
}

/* ANIMASI BERKEDIP */
@keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0.2; }
    100% { opacity: 1; }
}
    </style>
</head>
<body>

    <video autoplay muted loop playsinline>
        <source src="intro.mp4" type="video/mp4">
    </video>

    <div class="overlay">
        <h1>WELCOME TO ANF CINEMA</h1>
        <p>Nonton Film Seru Berisi Ilmu Hanya Disini</p>
    </div>

</body>
</html>
