<!DOCTYPE html>
<html>
<head>
    <title>ANF Cinema</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* VIDEO FULL SCREEN */
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* OVERLAY TEXT */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 20px 40px;
            border-radius: 10px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline>
        <source src="intro.mp4" type="video/mp4">
    </video>

    <div class="overlay">
        <h1>WELCOME TO ANF CINEMA</h1>
        <p>Nonton Film Seru Berisi Ilmu Hanya Disini</p>
    </div>

</body>
</html>
