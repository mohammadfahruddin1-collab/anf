<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANF Cinema</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Consolas, monospace;
    background:black;
    color:#39ff14;
}

/* VIDEO */
video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(0.4);
}

/* SCANLINE */
body::after{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:repeating-linear-gradient(
        to bottom,
        rgba(0,255,0,0.04) 0px,
        rgba(0,255,0,0.04) 2px,
        transparent 2px,
        transparent 4px
    );
    pointer-events:none;
}

/* POSISI */
.overlay{
    position:absolute;
    top:40px;
    right:50px;
    text-align:right;
}

/* TEKS */
.glitch{
    position:relative;
    display:inline-block;

    font-size:26px;
    font-weight:bold;
    color:#39ff14;

    text-shadow:
        0 0 5px #39ff14,
        0 0 10px #39ff14;
}

/* EFEK KETIK */
.typing{
    width:0;
    overflow:hidden;
    white-space:nowrap;

    /* CURSOR */
    border-right:3px solid #00ff00;

    animation:
        typing 4s steps(22,end) forwards,
        blink .7s infinite;
}

/* ANIMASI KETIK */
@keyframes typing{
    from{
        width:0;
    }
    to{
        width:22ch;
    }
}

/* CURSOR BLINK */
@keyframes blink{
    50%{
        border-color:transparent;
    }
}

/* GLITCH */
.glitch::before,
.glitch::after{
    content:attr(data-text);
    position:absolute;
    top:0;
    left:0;
    width:100%;
    opacity:0.8;
}

.glitch::before{
    color:red;
    animation:glitchTop 2s infinite;
}

.glitch::after{
    color:blue;
    animation:glitchBottom 2s infinite;
}

@keyframes glitchTop{
    0%,90%,100%{
        clip-path:inset(0 0 100% 0);
        transform:none;
    }

    92%{
        clip-path:inset(0 0 60% 0);
        transform:translate(-2px,-2px);
    }

    94%{
        clip-path:inset(0 0 30% 0);
        transform:translate(2px,2px);
    }
}

@keyframes glitchBottom{
    0%,90%,100%{
        clip-path:inset(100% 0 0 0);
        transform:none;
    }

    92%{
        clip-path:inset(60% 0 0 0);
        transform:translate(2px,2px);
    }

    94%{
        clip-path:inset(30% 0 0 0);
        transform:translate(-2px,-2px);
    }
}

/* SUBTEXT */
p{
    font-size:14px;
    margin-top:8px;
    color:#00ffcc;

    text-shadow:
        0 0 5px #00ffcc;
}

</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="intro.mp4" type="video/mp4">
</video>

<div class="overlay">

    <h1 class="glitch typing"
        data-text="WELCOME TO ANF CINEMA">

        WELCOME TO ANF CINEMA

    </h1>

    <p>Film Seru Isi Ilmu</p>

</div>

</body>
</html>
